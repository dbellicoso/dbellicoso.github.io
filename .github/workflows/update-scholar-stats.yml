name: Update Google Scholar stats

on:
  schedule:
    - cron: "17 4 * * 1" # every Monday at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write # commit _data/scholar.yml
  actions: write # start the deploy workflow

concurrency:
  group: "scholar-stats"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Fetch stats from Google Scholar 🎓
        run: python3 bin/update-scholar-stats.py
      - name: Commit and deploy if the stats changed 🚀
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/scholar.yml; then
            echo "Stats unchanged; nothing to deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.yml
          git commit -m "Update Google Scholar stats"
          git push
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
